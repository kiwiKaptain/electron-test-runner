name: Build & Publish Electron App

on:
    push:
        tags:
            - "v*" # Triggers the pipeline when you push v0.0.1, v1.0.0, etc.

jobs:
    release:
        runs-on: windows-latest # Compiles on a Windows server to perfectly package node.exe

        permissions:
            contents: write # Grants permission to create releases and upload files

        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Node.js Environment
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            # Step 1: Install root dependencies for your Electron dashboard
            - name: Install Dashboard (Root) Dependencies
              run: npm install

            # Step 2: Navigate into test-runtime and install its dependencies in one fluid block
            - name: Install Test-Runtime Dependencies
              run: |
                  cd test-runtime
                  npm install

            # Step 3: Create bin folder in root and fetch the REAL x64 node.exe binary
            - name: Download Standalone node.exe for Bundling
              run: |
                  mkdir bin
                  curl -L https://nodejs.org -o bin/node.exe

            # Step 4: Use working-directory parameter to let Playwright download Chromium safely inside its folder
            - name: Force Playwright to Install Browsers into Specific Folder
              working-directory: ./test-runtime
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ./playwright-browsers
              run: npx playwright install chromium

            # Step 5: Bundle and Publish everything from the root folder
            # Runs your 'package' script to create the raw folder layout
            # Compresses the loose compiled folder into a clean portable zip archive
            # npm run publish # Triggers forge to pack and upload
            - name: Compile Loose Application Directory
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticated write token
                  PLAYWRIGHT_BROWSERS_PATH: ./test-runtime/playwright-browsers
              run: npm run package

            # Step 6: Compress the loose folder into a clean portable zip archive using PowerShell
            - name: Compress Loose Directory into Portable Zip
              run: Compress-Archive -Path "out/PlayWright Test Runner-win32-x64" -DestinationPath "out/PlayWright-Test-Runner-Portable.zip"

            # Step 7: Post the portable zip file directly to your GitHub Releases tab
            - name: Upload Portable Zip to GitHub Releases
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: out/PlayWright-Test-Runner-Portable.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
