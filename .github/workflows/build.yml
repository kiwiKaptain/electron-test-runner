name: Build & Publish Electron App

on:
    push:
        tags:
            - "v*" # Triggers the pipeline when you push v0.0.1, v1.0.0, etc.

jobs:
    release:
        runs-on: windows-latest # Compiles on a Windows server to perfectly package node.exe

        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Node.js Environment
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            # Step 1: Install root dependencies for your Electron dashboard
            - name: Install Dashboard (Root) Dependencies
              run: npm install

            # Step 2: Navigate into test-runtime and install its specific dependencies
            - name: Install Test-Runtime Dependencies
              run: |
                  cd test-runtime
                  npm install

            - name: Go To Base Directory
              run: |
                  cd ..

            - name: Download Standalone node.exe for Bundling
              run: |
                  mkdir bin
                  curl -L https://nodejs.org -o bin/node.exe

            - name: Install Test-Runtime Dependencies
              run: |
                  cd test-runtime

            # Step 3: Download Playwright Chrome into the target directory
            - name: Force Playwright to Install Browsers into Specific Folder
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ./test-runtime/playwright-browsers
              run: npx playwright install chromium

            # Step 4: Bundle and Publish everything
            - name: Compile and Publish to GitHub Releases
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in GitHub token for auth
                  PLAYWRIGHT_BROWSERS_PATH: ./test-runtime/playwright-browsers
              run: npm run publish # Replaced make with publish so Electron Forge uploads to GitHub
